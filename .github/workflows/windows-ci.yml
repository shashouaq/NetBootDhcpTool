name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned release HTTP fallback
        shell: pwsh
        run: |
          python -m pip install -r .\build\release-pipeline\requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned release HTTP fallback installation failed.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Fresh official dependency audit and restore
        shell: pwsh
        run: .\build\release-pipeline\Invoke-FreshNuGetAudit.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'windows-ci-audit')
      - name: Preserve fresh audit diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ci-audit
          path: ${{ runner.temp }}\windows-ci-audit\*
          retention-days: 90
          if-no-files-found: error
      - name: Verify release and localization consistency
        shell: pwsh
        run: .\build\verify-maintenance.ps1
      - name: Test idempotent release pipeline helpers
        shell: pwsh
        run: |
          try {
            .\build\tests\release-pipeline.tests.ps1
          } catch {
            $message = ($_.Exception.Message -replace '[\r\n]+', ' ').Trim()
            $position = ($_.InvocationInfo.PositionMessage -replace '[\r\n]+', ' ').Trim()
            Write-Output "::error title=Release pipeline test failure::$message $position"
            throw
          }
      - name: Install pinned NSIS for PE resource regression
        shell: pwsh
        run: |
          choco install nsis --version=3.12.0 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Pinned NSIS installation failed.' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler is missing.' }
          $compilerVersion = (& $compiler /VERSION | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -notmatch '^v?3\.12(?:\.|$)') { throw 'Expected NSIS compiler 3.12.' }
          "MAKENSIS_PATH=$compiler" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test release HTTP resilience and PE stamping
        shell: pwsh
        run: |
          .\build\tests\release-resilience.tests.ps1
          .\build\tests\http-resilience.tests.ps1
          .\build\tests\pe-version.tests.ps1
          .\build\tests\nuget-audit.tests.ps1
          python .\build\tests\python-http.tests.py
          if ($LASTEXITCODE -ne 0) { throw 'Python TLS fallback regression failed.' }
      - name: Test independent Gitee mirror recovery
        shell: pwsh
        run: .\build\tests\gitee-mirror.tests.ps1
      - name: Test current-user Gitee credential storage
        shell: pwsh
        run: .\build\tests\gitee-credential.tests.ps1
      - name: Test formal package content allowlist
        shell: pwsh
        run: .\build\tests\package-content.tests.ps1
      - name: Build the actual-client manifest gate
        run: dotnet build .\build\release-pipeline\ClientManifestCheck.csproj -c Release
      - name: Build
        run: dotnet build .\NetBootDhcpTool.sln -c Release --no-restore
      - name: Run unit tests
        run: dotnet test .\src\NetBootDhcpTool.UnitTests\NetBootDhcpTool.UnitTests.csproj -c Release --no-build --minimum-expected-tests 1
      - name: Run network and persistence smoke tests
        run: dotnet run --project .\src\NetBootDhcpTool.Tests\NetBootDhcpTool.Tests.csproj -c Release --no-build
      - name: Run non-admin WPF UI smoke when available
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if ($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            Write-Host 'UI smoke skipped because this runner is elevated; run it on a standard-user Windows session.'
            exit 0
          }
          .\build\ui-automation-smoke.ps1

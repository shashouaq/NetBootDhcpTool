name: Gitee Mirror Script Tests (manual diagnostic)
run-name: Gitee mirror script diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-script:
    name: Run mocked Gitee mirror recovery tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test local PowerShell mirror modes without publishing
        shell: pwsh
        run: .\build\tests\gitee-mirror.tests.ps1

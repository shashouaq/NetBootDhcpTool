name: Formal Release
run-name: Formal release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable tag whose exact main commit already passed Windows CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: netboot-formal-release
  cancel-in-progress: false

jobs:
  verify-ci:
    name: Verify tag and exact-commit CI
    runs-on: windows-latest
    outputs:
      release_commit: ${{ steps.verify.outputs.release_commit }}
      publisher_commit: ${{ steps.verify.outputs.publisher_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned release HTTP fallback
        shell: pwsh
        run: |
          python -m pip install -r .\build\release-pipeline\requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned release HTTP fallback installation failed.' }
      - name: Require a stable main tag with passing Windows CI
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'Dispatch Formal Release from the main branch.' }
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release tag must use v<major>.<minor>.<patch>.' }
          . .\build\release-identity.ps1
          $version = (Get-NetBootVersionMetadata).Version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag does not match the checked-in application version.' }
          git fetch origin main --tags
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main and release tags.' }
          $releaseCommit = (git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Release tag $($env:RELEASE_TAG) does not exist on GitHub." }
          $publisherCommit = ([string]$env:GITHUB_SHA).ToLowerInvariant()
          if ($publisherCommit -notmatch '^[a-f0-9]{40}$') { throw 'Workflow publisher commit is not a full Git SHA.' }
          $mainCommit = (git rev-parse 'refs/remotes/origin/main').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve origin/main.' }
          git merge-base --is-ancestor $releaseCommit $mainCommit
          if ($LASTEXITCODE -ne 0) { throw 'Release tag is not contained in origin/main.' }
          git merge-base --is-ancestor $publisherCommit $mainCommit
          if ($LASTEXITCODE -ne 0) { throw 'Workflow publisher commit is not contained in origin/main.' }

          foreach ($requiredTagFile in @('build/publish.ps1', 'scripts/Prepare-GitHubRelease.ps1', 'scripts/Publish-GitHubRelease.ps1', 'scripts/Publish-GiteeMirror.ps1', 'build/release-pipeline/ReleaseState.psm1')) {
            git cat-file -e ($releaseCommit + ':' + $requiredTagFile)
            if ($LASTEXITCODE -ne 0) { throw "Release tag $($env:RELEASE_TAG) does not contain required release file $requiredTagFile." }
          }
          Import-Module .\build\release-pipeline\ReleaseState.psm1 -Force
          foreach ($requiredCommit in @($releaseCommit, $publisherCommit) | Select-Object -Unique) {
            $endpoint = "repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-ci.yml/runs?head_sha=$requiredCommit&status=success&per_page=100"
            Import-Module .\build\release-pipeline\ReleaseTransport.psm1
            $response = Invoke-ReleaseHttp -Uri "https://api.github.com/$endpoint" -Headers @{Authorization="Bearer $env:GH_TOKEN";'User-Agent'='NetBootDhcpTool-CI'} -Stage exact-ci
            if ($response.StatusCode -ne 200) { throw "Could not read Windows CI runs for commit $requiredCommit." }
            $runJson = $response.Content
            $runs = $runJson | ConvertFrom-Json
            if (-not (Test-SuccessfulMainWindowsCiRun -Runs @($runs.workflow_runs) -Commit $requiredCommit)) {
              throw "Windows CI has no successful main push run for exact commit $requiredCommit."
            }
          }
          "release_commit=$releaseCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publisher_commit=$publisherCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag $($env:RELEASE_TAG) and publisher $publisherCommit both have successful exact-commit Windows CI."

  build-once:
    name: Build, test and sign once
    needs: verify-ci
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401

      - name: Fresh official dependency audit before signing
        shell: pwsh
        run: .\build\release-pipeline\Invoke-FreshNuGetAudit.ps1 -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'formal-audit')

      - name: Ensure 7-Zip is available
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files\7-Zip\7z.exe')) {
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install 7-Zip on the GitHub-hosted runner.' }
          }

      - name: Install pinned NSIS 3.12 compiler
        shell: pwsh
        run: |
          winget install --id NSIS.NSIS --exact --version 3.12 --source winget --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'Could not install pinned NSIS 3.12.' }
          $makensis = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $makensis) { throw 'NSIS was installed but makensis.exe was not found.' }
          $versionOutput = (& $makensis /VERSION | Out-String).Trim()
          if ($versionOutput -notmatch '^v?3\.12(?:\.|$)') { throw "Expected NSIS 3.12; got $versionOutput." }
          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and sign the immutable package set
        shell: pwsh
        env:
          NETBOOT_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.NETBOOT_UPDATE_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'formal-release-assets'
          .\scripts\Prepare-GitHubRelease.ps1 -Tag $env:RELEASE_TAG -OutputDirectory $assetDirectory -GitHubRepository $env:GITHUB_REPOSITORY

      - uses: actions/upload-artifact@v7
        with:
          name: formal-release-${{ inputs.release_tag }}
          path: ${{ runner.temp }}\formal-release-assets\*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  publish-github:
    name: Publish and verify GitHub Release
    needs: [verify-ci, build-once]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: formal-release-${{ inputs.release_tag }}
          path: ${{ runner.temp }}\formal-release-assets

      - name: Install pinned release HTTP fallback
        shell: pwsh
        run: |
          python -m pip install -r .\build\release-pipeline\requirements.txt --disable-pip-version-check
          if ($LASTEXITCODE -ne 0) { throw 'Pinned release HTTP fallback installation failed.' }
      - name: Publish only the verified build artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP 'formal-release-assets'
          .\scripts\Publish-GitHubRelease.ps1 -Tag $env:RELEASE_TAG -AssetDirectory $assetDirectory -GitHubRepository $env:GITHUB_REPOSITORY
